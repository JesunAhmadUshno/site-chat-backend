source:
  - changed-files:
      - any-glob-to-any-file: ["app/**", "mcp_server/**"]
widget:
  - changed-files:
      - any-glob-to-any-file: ["widget/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["test/**"]
contexts:
  - changed-files:
      - any-glob-to-any-file: ["contexts/**", "scripts/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["README.md"]
